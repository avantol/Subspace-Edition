permissions:
  contents: read
  attestations: write
  id-token: write

name: macOS Build (Subspace)

on:
  push:
    branches: [master]
    # [ciskip 2026-09-06] Asset/doc-only pushes (guide screenshots,
    # web uploads) do not trigger builds. A push touching ANY other
    # file still builds.
    paths-ignore:
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build_macos:
    runs-on: ${{ matrix.runner }}
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        brew update
        # [macfix 2026-09-06] fdk-aac REMOVED: Homebrew deleted the
        # formula ("No formulae or casks found"), which failed both
        # runners on builds 472/473 -- and our ffmpeg configure line
        # enables no external codecs, so it was never used.
        brew install autoconf automake libtool pkgconf git lame libass libtool libvorbis \
          libvpx opus sdl shtool texi2html theora wget x264 x265 xvid nasm create-dmg

    - name: Cache libusb 1.0.29
      id: cache-usb
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/local/libusb
        key: ${{ runner.os }}-${{ runner.arch }}-libusb1029

    # [ffmpegdrop 2026-09-09] ffmpeg cache/build/save steps REMOVED.
    # Nothing consumes it: CMakeLists never references ffmpeg/avcodec,
    # our Qt components are Network SerialPort Sql Widgets (no
    # Multimedia -- audio is miniaudio), and the configure line below
    # never put local/ffmpeg on CMAKE_PREFIX_PATH, so it was
    # unfindable even in principle. Leftover from the Qt6Multimedia
    # era; it cost a full ffmpeg compile on every cache miss.
    # Verified: no av*/ffmpeg DLLs in the Windows artifact, and the
    # Linux binary links no avcodec/avformat/avutil.

    # Hamlib 4.7.0+ required for IC-7300 MK2 (new rig model, CI-V 0xB6)
    - name: Cache Hamlib 4.7.2
      id: cache-hamlib
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/local/hamlib
        key: ${{ runner.os }}-${{ runner.arch }}-hamlib472

    - name: Cache fftw 3.3.10
      id: cache-fftw
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/local/fftw
        key: ${{ runner.os }}-${{ runner.arch }}-fftw3310

    - name: Cache Boost 1.88
      id: cache-boost
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/local/boost
        key: ${{ runner.os }}-${{ runner.arch }}-boost188

    - name: Install libusb 1.0.29
      if: steps.cache-usb.outputs.cache-hit != 'true'
      run: |
        curl --location --output /tmp/v1.0.29.tar.gz https://github.com/libusb/libusb/archive/refs/tags/v1.0.29.tar.gz
        cd /tmp && tar zxf v1.0.29.tar.gz && cd libusb-1.0.29
        ./bootstrap.sh
        ./configure --prefix=${GITHUB_WORKSPACE}/local/libusb
        make && make install

    - name: Save libusb cache
      if: steps.cache-usb.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-libusb1029
        path: ${{ github.workspace }}/local/libusb

    - name: Install Hamlib 4.7.2
      if: steps.cache-hamlib.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 --branch=4.7.2 https://github.com/Hamlib/Hamlib.git /tmp/hamlib
        cd /tmp/hamlib
        ./bootstrap
        ./configure --prefix=${GITHUB_WORKSPACE}/local/hamlib
        make -j 4 && make install-strip

    - name: Save Hamlib cache
      if: steps.cache-hamlib.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-hamlib472
        path: ${{ github.workspace }}/local/hamlib

    - name: Install fftw 3.3.10
      if: steps.cache-fftw.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        curl --location --output fftw-3.3.10.tar.gz https://www.fftw.org/fftw-3.3.10.tar.gz
        tar zxf fftw-3.3.10.tar.gz && cd fftw-3.3.10
        ./configure --prefix=${GITHUB_WORKSPACE}/local/fftw --enable-threads --enable-shared --enable-float
        make && make install

    - name: Save fftw cache
      if: steps.cache-fftw.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-fftw3310
        path: ${{ github.workspace }}/local/fftw

    - name: Install Boost 1.88
      if: steps.cache-boost.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        curl --location --output boost-1.88.0.tar.gz https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.gz
        tar zxf boost-1.88.0.tar.gz && cd boost_1_88_0
        ./bootstrap.sh --prefix=${GITHUB_WORKSPACE}/local/boost
        ./b2 install

    - name: Save Boost cache
      if: steps.cache-boost.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-boost188
        path: ${{ github.workspace }}/local/boost

    # [ffmpegdrop 2026-09-09] ffmpeg build + cache-save steps removed
    # here too -- see the note beside the cache-restore step above.

    - name: Install Qt 6.9.3
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        aqtversion: '==3.1.*'
        version: '6.9.3'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtserialport'
        archives: 'qtsvg qtdeclarative qtbase'

    - name: Build JS8Call
      run: |
        mkdir -p ./build && cd ./build
        cmake -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/local/hamlib;${GITHUB_WORKSPACE}/local/fftw;${GITHUB_WORKSPACE}/local/boost;${GITHUB_WORKSPACE}/local/libusb" \
              -DCMAKE_BUILD_TYPE=Release \
              ..
        make -j 4

    - name: Get version
      id: version
      run: |
        MAJOR=$(grep WSJTX_VERSION_MAJOR Versions.cmake | sed 's/[^0-9]//g')
        MINOR=$(grep WSJTX_VERSION_MINOR Versions.cmake | sed 's/[^0-9]//g')
        PATCH=$(grep WSJTX_VERSION_PATCH Versions.cmake | sed 's/.*PATCH //' | sed 's/)//')
        echo "ver=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

    - name: Rename .app bundle
      run: mv build/JS8Call.app "build/Subspace Edition.app"

    - name: Create DMG
      run: create-dmg "Subspace-Edition-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-macos.dmg" "build/Subspace Edition.app"

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-macos.dmg"
        path: ${{ github.workspace }}/Subspace-Edition-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-macos.dmg

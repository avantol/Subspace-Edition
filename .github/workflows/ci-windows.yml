name: Windows Build (Subspace)

on:
  push:
    branches: [master]
    # [ciskip 2026-09-06] Asset/doc-only pushes (guide screenshots,
    # web uploads) do not trigger builds. A push touching ANY other
    # file still builds.
    paths-ignore:
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (Debug/Release)'
        required: false
        type: string
        default: 'Release'
      # [operator 2026-10-21] JTTY is always built: ENABLE_JTTY=OFF is no
      # longer tested, so a manual run no longer offers it.

jobs:
  build_windows:
    runs-on: windows-2025
    steps:
    - run: git config --global core.autocrlf input
    - uses: actions/checkout@v5

    - uses: msys2/setup-msys2@v2
      with:
        update: true
        cache: true
        install: >-
          git base-devel make unzip
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          boost:p
          fftw:p

    # [2026-10-15] MSYS2 dropped libusb for mingw64 from its package
    # database (ucrt64/clang64 only; "target not found", run 38824655859
    # twice), but FindHamlib.cmake REQUIRES its headers and library
    # (libfind_package (Hamlib Usb)) -- leaving it out failed Configure
    # (run 38824979430). The last mingw64 build is still on MSYS2's file
    # server: install that exact file. If it is ever removed there, the
    # choice is between moving this build to UCRT64 and making Usb optional
    # in FindHamlib on Windows.
    - name: Install libusb (last mingw64 build, by file)
      shell: msys2 {0}
      run: |
        pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst

    # [2026-11-22] The same for qt6-serialport: "target not found:
    # mingw-w64-x86_64-qt6-serialport" (run 45097485930, twice) on the day
    # MSYS2 moved mingw64 to Qt 6.12.0. qt6-base 6.12.0-2 and qt6-tools
    # 6.12.0-1 are in the package database; the serialport file of the same
    # Qt version is on the file server. It MUST match qt6-base's Qt version.
    #
    # [2026-11-27] It stopped matching five days later: MSYS2 moved
    # qt6-base to 6.12.1 while qt6-serialport stayed at 6.12.0 (no 6.12.1
    # file exists). The build stayed green and the installers for 528 and
    # 529 would not start ("entry point not found in Qt6SerialPort.dll").
    # So ALL THREE Qt packages are now installed by file, at ONE Qt
    # version, and the next step refuses to go on when they differ.
    # To move to a newer Qt: change the three file names together, to a
    # version the file server has for all three. When the database lists
    # qt6-serialport again, the three can go back into the pacboy list
    # above (qt6-base:p qt6-tools:p qt6-serialport:p); keep the check.
    - name: Install Qt (three packages by file, one Qt version)
      shell: msys2 {0}
      run: |
        pacman -U --noconfirm \
          https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-qt6-base-6.12.0-2-any.pkg.tar.zst \
          https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-qt6-tools-6.12.0-1-any.pkg.tar.zst \
          https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-qt6-serialport-6.12.0-1-any.pkg.tar.zst

    - name: Check that every Qt package has the same Qt version
      shell: msys2 {0}
      run: |
        # "name version-release" -> version, release number dropped
        qtver() { pacman -Q "mingw-w64-x86_64-$1" | awk '{print $2}' | sed 's/-[0-9]*$//'; }
        base=$(qtver qt6-base)
        tools=$(qtver qt6-tools)
        serial=$(qtver qt6-serialport)
        echo "qt6-base=$base qt6-tools=$tools qt6-serialport=$serial"
        if [ -z "$base" ] || [ "$base" != "$tools" ] || [ "$base" != "$serial" ]; then
            echo "::error::Qt packages are not all the same Qt version (base=$base tools=$tools serialport=$serial). The program would not start on Windows."
            exit 1
        fi
        # every other installed Qt 6 package is listed, and a different
        # version is flagged (a warning: these come in as build-time
        # dependencies; what ships is proven by the start test below)
        pacman -Q | awk '$1 ~ /^mingw-w64-x86_64-qt6-/ {print $1, $2}' | while read name ver; do
            v=$(echo "$ver" | sed 's/-[0-9]*$//')
            echo "  $name $v"
            if [ "$v" != "$base" ]; then
                echo "::warning::$name is Qt $v, qt6-base is Qt $base"
            fi
        done

    # Build 135: dropped jurplel/install-qt-action — aqt's metadata
    # consistently lagged Qt's new per-toolchain Updates.xml layout for
    # 6.11.x, and aqt 3.3/3.4 didn't recognize the qt6_6110_mingw
    # subdirectory structure. MSYS2's qt6-* packages track upstream
    # within days of release, build with the same MinGW GCC 15 we use
    # everywhere else (no ABI cross-toolchain surprises), and arrive
    # via the same package manager already in this workflow. Qt headers,
    # libs, plugins, and windeployqt all live under MSYSTEM_PREFIX
    # (/mingw64 on this runner).

    - name: Download Hamlib
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 'hamlib/hamlib'
        fileName: 'hamlib-w64-4.7.2.zip'
        tag: '4.7.2'
        extract: true
        out-file-path: 'local/hamlib-tmp'

    - name: Setup Hamlib
      shell: msys2 {0}
      run: |
        mv local/hamlib-tmp/hamlib-w64-4.7.2 local/hamlib
        mv local/hamlib/lib/gcc/libhamlib.dll.a local/hamlib/lib/libhamlib.dll.a

    - name: Configure
      shell: msys2 {0}
      run: |
        cmake -B build \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/local/hamlib;${MSYSTEM_PREFIX}" \
          -DCMAKE_BUILD_TYPE=${{ inputs.build-type || 'Release' }} \
          -DENABLE_JTTY=ON \
          -DFFTW3F_LIBRARY=/mingw64/lib/libfftw3f.a

    - name: Build
      shell: msys2 {0}
      run: cmake --build build -j$(nproc)

    - name: Save Debug Symbols
      shell: msys2 {0}
      run: |
        # Save unstripped binary with DWARF debug info for crash analysis.
        # Use objcopy to extract debug symbols, then strip the release binary.
        cp build/JS8Call.exe build/JS8Call-debug.exe
        strip build/JS8Call.exe

    - name: Package
      shell: msys2 {0}
      run: |
        cp build/JS8Call.exe build/JS8Call/
        # [conveylicense] This copied build/JS8Call/LICENSE onto itself
        # -- a no-op, silenced by "2>/dev/null || true", so the Windows
        # packages have NEVER carried the GPL text. Source is the repo
        # root, and the failure is no longer swallowed.
        cp LICENSE build/JS8Call/
        cp local/hamlib/bin/libhamlib-4.dll build/JS8Call/
        cp local/hamlib/bin/libusb-1.0.dll build/JS8Call/

        # Build 137: recursively bundle MSYS2 runtime DLL dependencies.
        # Build 136's walker was buggy -- it gated recursion on
        # "destination doesn't already exist", so when windeployqt had
        # already placed a Qt6 DLL we'd skip BOTH the copy AND the
        # recursion, missing every transitive dep of that DLL. Result:
        # 27 bundled DLLs (just direct + windeployqt's set), libzstd /
        # libb2 / libbrotli all missed.
        # This version keeps the two decisions separate: always walk
        # the source DLL's imports (with a visited-set to prevent
        # cycles); only copy if destination is absent.
        visited_dir=$(mktemp -d)
        walk_deps() {
            local pe="$1"
            local target_dir="$2"
            local key=$(basename "$pe")
            [ -e "$visited_dir/$key" ] && return
            touch "$visited_dir/$key"
            objdump -p "$pe" 2>/dev/null | awk '/DLL Name:/{print $3}' | while read dll; do
                local src="/mingw64/bin/$dll"
                local dst="$target_dir/$dll"
                if [ -f "$src" ]; then
                    [ -f "$dst" ] || cp "$src" "$dst"
                    walk_deps "$src" "$target_dir"
                fi
            done
        }
        walk_deps build/JS8Call/JS8Call.exe build/JS8Call/
        # [sqltrim 2026-09-08] windeployqt copies EVERY SQL driver
        # plugin the MSYS2 Qt install ships; GridDb opens QSQLITE
        # only. Drop the rest BEFORE the plugin dep walk below, so
        # their client libraries are never pulled into the bundle
        # root either.
        for drv in build/JS8Call/sqldrivers/*.dll; do
            case "$(basename "$drv")" in
                qsqlite.dll) ;;
                *) rm -f "$drv" ;;
            esac
        done
        # Plugins copied by windeployqt have their own dependencies
        # too. EVERY plugin subdirectory, generically -- the previous
        # hand-list (7 dirs, written at Build 137) predated Qt Sql:
        # when Build 371 added it, windeployqt placed
        # sqldrivers/qsqlite.dll but nothing walked its imports, so
        # libsqlite3-0.dll was never bundled and every Windows
        # installer since shipped a dead grid bank ("Driver not
        # loaded", field logs 2026-08-30). A glob cannot repeat that
        # mistake for the next module.
        for plugin in build/JS8Call/*/*.dll; do
            [ -f "$plugin" ] && walk_deps "$plugin" build/JS8Call/
        done
        # Walk again on Qt6*.dll because they were placed by windeployqt
        # before our walk started (already-existed case skipped recursion
        # under Build 136's broken walker). visited-set check makes
        # this idempotent now, but explicit re-walk gives belt-and-
        # suspenders coverage.
        for qtdll in build/JS8Call/Qt6*.dll; do
            [ -f "$qtdll" ] && walk_deps "$qtdll" build/JS8Call/
        done
        rm -rf "$visited_dir"
        echo "=== Bundled DLLs ==="
        ls build/JS8Call/*.dll | wc -l
        ls build/JS8Call/*.dll

    # [2026-11-27] A green build said nothing about whether the program
    # starts: a mismatched DLL only shows when Windows loads the program.
    # So the packaged program -- the exact folder that goes into the
    # installer -- is started once here. "--version" loads every DLL the
    # program links, creates the Qt application (platform plugin
    # included), prints the version and exits. A program Windows refuses
    # to load, or one that hangs, fails the build.
    - name: Start the packaged program once
      shell: msys2 {0}
      env:
        # the version goes to the console, never into a message box
        QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: 1
      run: |
        cd build/JS8Call
        set +e
        # PATH holds Windows' own folders only, as on a user's PC: a DLL
        # missing from the package is not quietly found in /mingw64/bin
        env PATH="/c/Windows/System32:/c/Windows" /usr/bin/timeout 120 ./JS8Call.exe --version
        rc=$?
        set -e
        echo "exit code: $rc"
        if [ "$rc" -ne 0 ]; then
            echo "::error::The packaged JS8Call.exe did not start (exit code $rc; 124 = no exit within 120 s). The installer would be broken."
            exit 1
        fi

    - name: Extract Version
      id: version
      shell: msys2 {0}
      run: |
        # Derive full MAJOR.MINOR.PATCH from Versions.cmake instead of
        # hardcoding the MAJOR.MINOR prefix. Survives version bumps
        # without needing CI workflow edits — fix for v4.1.0 bump
        # where this previously emitted 4.0.x for a 4.1.x build.
        major=$(grep WSJTX_VERSION_MAJOR Versions.cmake | grep -oP '[0-9]+')
        minor=$(grep WSJTX_VERSION_MINOR Versions.cmake | grep -oP '[0-9]+')
        patch=$(grep WSJTX_VERSION_PATCH Versions.cmake | grep -oP '[0-9]+\.[0-9]+')
        echo "APP_VERSION=${major}.${minor}.${patch}" >> $GITHUB_OUTPUT

    - name: Create Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ steps.version.outputs.APP_VERSION }}" installer\js8call-subspace.iss
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition-Files_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./build/JS8Call/

    - name: Upload Installer
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./installer/Output/Subspace-Edition_${{ steps.version.outputs.APP_VERSION }}_win64.exe

    - name: Upload Debug Symbols
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition-Debug_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./build/JS8Call-debug.exe

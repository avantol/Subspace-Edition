name: Windows Build (Subspace)

on:
  push:
    branches: [master]
    # [ciskip 2026-09-06] Asset/doc-only pushes (guide screenshots,
    # web uploads) do not trigger builds. A push touching ANY other
    # file still builds.
    paths-ignore:
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (Debug/Release)'
        required: false
        type: string
        default: 'Release'

jobs:
  build_windows:
    runs-on: windows-2025
    steps:
    - run: git config --global core.autocrlf input
    - uses: actions/checkout@v5

    - uses: msys2/setup-msys2@v2
      with:
        update: true
        cache: true
        install: >-
          git base-devel make unzip
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          libusb:p
          boost:p
          fftw:p
          qt6-base:p
          qt6-serialport:p
          qt6-tools:p

    # Build 135: dropped jurplel/install-qt-action — aqt's metadata
    # consistently lagged Qt's new per-toolchain Updates.xml layout for
    # 6.11.x, and aqt 3.3/3.4 didn't recognize the qt6_6110_mingw
    # subdirectory structure. MSYS2's qt6-* packages track upstream
    # within days of release, build with the same MinGW GCC 15 we use
    # everywhere else (no ABI cross-toolchain surprises), and arrive
    # via the same package manager already in this workflow. Qt headers,
    # libs, plugins, and windeployqt all live under MSYSTEM_PREFIX
    # (/mingw64 on this runner).

    - name: Download Hamlib
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 'hamlib/hamlib'
        fileName: 'hamlib-w64-4.7.2.zip'
        tag: '4.7.2'
        extract: true
        out-file-path: 'local/hamlib-tmp'

    - name: Setup Hamlib
      shell: msys2 {0}
      run: |
        mv local/hamlib-tmp/hamlib-w64-4.7.2 local/hamlib
        mv local/hamlib/lib/gcc/libhamlib.dll.a local/hamlib/lib/libhamlib.dll.a

    - name: Configure
      shell: msys2 {0}
      run: |
        cmake -B build \
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/local/hamlib;${MSYSTEM_PREFIX}" \
          -DCMAKE_BUILD_TYPE=${{ inputs.build-type || 'Release' }} \
          -DFFTW3F_LIBRARY=/mingw64/lib/libfftw3f.a

    - name: Build
      shell: msys2 {0}
      run: cmake --build build -j$(nproc)

    - name: Save Debug Symbols
      shell: msys2 {0}
      run: |
        # Save unstripped binary with DWARF debug info for crash analysis.
        # Use objcopy to extract debug symbols, then strip the release binary.
        cp build/JS8Call.exe build/JS8Call-debug.exe
        strip build/JS8Call.exe

    - name: Package
      shell: msys2 {0}
      run: |
        cp build/JS8Call.exe build/JS8Call/
        cp build/JS8Call/LICENSE build/JS8Call/ 2>/dev/null || true
        cp local/hamlib/bin/libhamlib-4.dll build/JS8Call/
        cp local/hamlib/bin/libusb-1.0.dll build/JS8Call/

        # Build 137: recursively bundle MSYS2 runtime DLL dependencies.
        # Build 136's walker was buggy -- it gated recursion on
        # "destination doesn't already exist", so when windeployqt had
        # already placed a Qt6 DLL we'd skip BOTH the copy AND the
        # recursion, missing every transitive dep of that DLL. Result:
        # 27 bundled DLLs (just direct + windeployqt's set), libzstd /
        # libb2 / libbrotli all missed.
        # This version keeps the two decisions separate: always walk
        # the source DLL's imports (with a visited-set to prevent
        # cycles); only copy if destination is absent.
        visited_dir=$(mktemp -d)
        walk_deps() {
            local pe="$1"
            local target_dir="$2"
            local key=$(basename "$pe")
            [ -e "$visited_dir/$key" ] && return
            touch "$visited_dir/$key"
            objdump -p "$pe" 2>/dev/null | awk '/DLL Name:/{print $3}' | while read dll; do
                local src="/mingw64/bin/$dll"
                local dst="$target_dir/$dll"
                if [ -f "$src" ]; then
                    [ -f "$dst" ] || cp "$src" "$dst"
                    walk_deps "$src" "$target_dir"
                fi
            done
        }
        walk_deps build/JS8Call/JS8Call.exe build/JS8Call/
        # [sqltrim 2026-09-08] windeployqt copies EVERY SQL driver
        # plugin the MSYS2 Qt install ships; GridDb opens QSQLITE
        # only. Drop the rest BEFORE the plugin dep walk below, so
        # their client libraries are never pulled into the bundle
        # root either.
        for drv in build/JS8Call/sqldrivers/*.dll; do
            case "$(basename "$drv")" in
                qsqlite.dll) ;;
                *) rm -f "$drv" ;;
            esac
        done
        # Plugins copied by windeployqt have their own dependencies
        # too. EVERY plugin subdirectory, generically -- the previous
        # hand-list (7 dirs, written at Build 137) predated Qt Sql:
        # when Build 371 added it, windeployqt placed
        # sqldrivers/qsqlite.dll but nothing walked its imports, so
        # libsqlite3-0.dll was never bundled and every Windows
        # installer since shipped a dead grid bank ("Driver not
        # loaded", field logs 2026-08-30). A glob cannot repeat that
        # mistake for the next module.
        for plugin in build/JS8Call/*/*.dll; do
            [ -f "$plugin" ] && walk_deps "$plugin" build/JS8Call/
        done
        # Walk again on Qt6*.dll because they were placed by windeployqt
        # before our walk started (already-existed case skipped recursion
        # under Build 136's broken walker). visited-set check makes
        # this idempotent now, but explicit re-walk gives belt-and-
        # suspenders coverage.
        for qtdll in build/JS8Call/Qt6*.dll; do
            [ -f "$qtdll" ] && walk_deps "$qtdll" build/JS8Call/
        done
        rm -rf "$visited_dir"
        echo "=== Bundled DLLs ==="
        ls build/JS8Call/*.dll | wc -l
        ls build/JS8Call/*.dll

    - name: Extract Version
      id: version
      shell: msys2 {0}
      run: |
        # Derive full MAJOR.MINOR.PATCH from Versions.cmake instead of
        # hardcoding the MAJOR.MINOR prefix. Survives version bumps
        # without needing CI workflow edits — fix for v4.1.0 bump
        # where this previously emitted 4.0.x for a 4.1.x build.
        major=$(grep WSJTX_VERSION_MAJOR Versions.cmake | grep -oP '[0-9]+')
        minor=$(grep WSJTX_VERSION_MINOR Versions.cmake | grep -oP '[0-9]+')
        patch=$(grep WSJTX_VERSION_PATCH Versions.cmake | grep -oP '[0-9]+\.[0-9]+')
        echo "APP_VERSION=${major}.${minor}.${patch}" >> $GITHUB_OUTPUT

    - name: Create Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ steps.version.outputs.APP_VERSION }}" installer\js8call-subspace.iss
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./build/JS8Call/

    - name: Upload Installer
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition-Setup_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./installer/Output/Subspace-Edition-Setup_${{ steps.version.outputs.APP_VERSION }}_win64.exe

    - name: Upload Debug Symbols
      uses: actions/upload-artifact@v5
      with:
        name: "Subspace-Edition-Debug_${{ steps.version.outputs.APP_VERSION }}_win64"
        path: ./build/JS8Call-debug.exe
